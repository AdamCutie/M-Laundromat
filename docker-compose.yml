services:
       # Your Express backend container
       api:
         build:
           context: ./server
           dockerfile: Dockerfile
         container_name: laundromat_api
         restart: always
         ports:
          - "5000:5000"
         env_file:
          - .env  # This loads your MONGO_URI (Atlas) and Gemini keys
         environment:
          - NODE_ENV=production