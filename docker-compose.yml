services:
  # The MongoDB database container
  db:
    image: mongo:latest
    container_name: laundromat_db
    restart: always
    ports:
      - "27017:27017" # Exposes MongoDB to the VPS (useful for local backups)
    volumes:
      - mongo_data:/data/db # Persists your data even if the container restarts

  # Your Express backend container
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: laundromat_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://db:27017/laundromat # Connects using the service name 'db'
      - PORT=5000
      - JWT_SECRET=your_super_secret_key_here # Update this!
    depends_on:
      - db

volumes:
  mongo_data:
